<style>
:root{
  --blue:#003E97; --blue-d:#002C6B; --blue-l:#E8EEF8; --yellow:#FFED00; --yellow-d:#D9C900;
  --green:#009735; --green-l:#EDF8F0;
  --ink:#12161C; --mute:#5A6472; --line:#D8DEE7; --bg:#F4F6F9; --card:#fff;
}
*{box-sizing:border-box}
.pw{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px;
  padding:0 0 28px;margin:0}
.pw .wrap{max-width:880px;margin:0 auto;padding:0 18px}
.pw h1{font-size:clamp(24px,3.6vw,32px);line-height:1.12;letter-spacing:-.025em;margin:0 0 8px;font-weight:800}
.pw h2{font-size:20px;margin:26px 0 10px;font-weight:800;letter-spacing:-.015em}
.pw p{margin:0 0 12px}
.pw .lead{color:var(--mute);font-size:17px;margin:0 0 18px;max-width:64ch;text-wrap:pretty}
.pw .small{font-size:14px;color:var(--mute)}
.pw a{color:var(--blue)}
.pw a:hover{color:var(--blue-d)}
.pw b{font-weight:750}
.pw kbd{font-family:inherit;font-weight:750;background:#fff;border:1px solid var(--line);
  border-bottom-width:3px;border-radius:5px;padding:1px 7px;font-size:.9em;white-space:nowrap}

/* ---------- sticky top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .in{max-width:880px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .logo{background:#fff;border-radius:8px;padding:7px 11px;display:flex;align-items:center;line-height:0}
.topbar .logo img{height:26px;width:auto;display:block}
.topbar .logo span{font-weight:800;color:var(--blue);font-size:16px;line-height:1}
.topbar .spacer{flex:1 1 auto}
.back{font:inherit;font-size:14px;font-weight:700;background:rgba(255,255,255,.14);border:0;color:#fff;
  cursor:pointer;padding:8px 13px;border-radius:7px}
.back:hover{background:rgba(255,255,255,.26)}
.lang{display:flex;gap:5px}
.lang button{font:inherit;font-size:14px;font-weight:800;padding:8px 11px;cursor:pointer;
  border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:7px}
.lang button:hover{background:rgba(255,255,255,.16)}
.lang button[aria-current="true"]{background:#fff;border-color:#fff;color:var(--blue)}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;gap:11px;font-weight:800;font-size:18px;
  background:var(--yellow);color:#12161C;padding:14px 26px;border-radius:10px;text-decoration:none;
  border:0;box-shadow:0 3px 0 var(--yellow-d);cursor:pointer;font-family:inherit;line-height:1.2}
.cta:hover{filter:brightness(1.04)}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-d)}
.cta.sm{font-size:16px;padding:11px 18px;gap:8px}
.step .go .cta{white-space:nowrap}
.step .skip{font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-l);
  border-radius:7px;padding:6px 11px;margin-top:2px}
.pw .homesub{font-size:15px;font-weight:650;color:var(--mute);margin:0 0 6px}
.pw h1 i.sub{font-style:normal;font-weight:650;font-size:.5em;letter-spacing:0;color:var(--mute);white-space:nowrap}
.pw .portal{font-size:15px;color:var(--mute);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:15px;font-weight:750;
  background:var(--blue);color:#fff;padding:11px 17px;border-radius:8px;text-decoration:none;
  border:0;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-l)}
.btn{white-space:nowrap}
.pw a.btn{color:#fff}
.pw a.btn.ghost{color:var(--blue)}
.pw a.btn.quiet{color:var(--mute)}
.pw a.cta{color:#12161C}
.btn.store{font-size:17px;padding:13px 20px;gap:10px}
.btn.quiet{background:transparent;color:var(--mute);border:1px solid var(--line);font-size:14px;padding:8px 13px;font-weight:700}
.btn.quiet:hover{background:#fff;color:var(--blue);border-color:var(--blue)}
.pw svg{flex:none}

/* ---------- home / language ---------- */
.home{text-align:center;padding:44px 0 20px}
.home img.mark{height:76px;width:auto;margin:0 auto 24px;display:block}
.quad{display:grid;grid-template-columns:1fr 1fr;width:80px;height:80px;border-radius:50%;overflow:hidden;margin:0 auto 26px}
.quad i{display:block}
.quad i:nth-child(1){background:var(--blue)} .quad i:nth-child(2){background:var(--yellow)}
.quad i:nth-child(3){background:var(--green)} .quad i:nth-child(4){background:var(--yellow)}
.langgrid{display:grid;gap:12px;grid-template-columns:1fr;max-width:440px;margin:28px auto 0}
@media(min-width:560px){.langgrid{grid-template-columns:1fr 1fr}}
.langgrid button{font:inherit;font-size:18px;font-weight:800;padding:18px 14px;cursor:pointer;
  background:#fff;color:var(--blue);border:2px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .12s,transform .12s}
.langgrid button:hover{border-color:var(--blue);transform:translateY(-2px)}
.langgrid button em{font-style:normal;font-size:14px;font-weight:650;color:var(--mute)}

.ctxbox{max-width:560px;margin:26px auto 0;text-align:left;display:flex;flex-direction:column;gap:8px}
.ctxbox p{margin:0;font-size:14px;color:var(--mute);line-height:1.45;display:flex;gap:10px;align-items:baseline}
.ctxbox p span{flex:none;font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--blue);
  background:var(--blue-l);border-radius:4px;padding:2px 6px;line-height:1.4}

/* ---------- profile picks ---------- */
.choices{display:grid;gap:14px;margin:0 0 16px}
@media(min-width:660px){.choices{grid-template-columns:repeat(3,1fr)}}
.pick{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:20px 20px;display:flex;flex-direction:column;gap:8px;width:100%;
  transition:border-color .12s,transform .12s,box-shadow .12s}
.pick:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,62,151,.10)}
.pick .ic{color:var(--blue)}
.pick .grp{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--blue);background:var(--blue-l);border-radius:5px;padding:3px 8px}
.pick .grp.grpx{color:#7A4B00;background:#FFF3DB}
.pick b{display:block;font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.pick span{font-size:15px;color:var(--mute)}
.pick .go{margin-top:auto;color:var(--blue);font-weight:800;font-size:15px}

/* ---------- bloc vidéo ---------- */
.vstep{margin:22px 0 0}
.vstep .vnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue-l);color:var(--blue);
  display:flex;align-items:center;justify-content:center}
.vbrowse{margin:0 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vbrowse > span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.vbrowse button{font:inherit;font-size:14px;font-weight:750;cursor:pointer;background:#fff;
  color:var(--blue);border:1px solid var(--line);border-radius:7px;padding:7px 12px}
.vbrowse button:hover{border-color:var(--blue);background:var(--blue-l)}
.vbrowse button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.vframe{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.vframe video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vchaps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 0}
.vbrowse{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vchaps .vlbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.vchaps button{font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:var(--blue);
  border:1px solid var(--line);border-radius:20px;padding:7px 13px}
.vchaps button:hover{border-color:var(--blue);background:var(--blue-l)}
.vchaps button.vdim{color:var(--mute);border-style:dashed}
.vchaps button.vdim i{font-style:normal;font-weight:650}
.vnote{margin:10px 0 0;font-size:14px;color:var(--mute)}
.vseek{margin:12px 0 0;font-size:14px}
.vfall{margin:10px 0 0;font-size:13px}
.vfall a{color:var(--mute)}
.vdeep{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;
  font-weight:700;color:var(--blue);background:transparent;border:0;padding:0;cursor:pointer;
  border-bottom:1px solid transparent}
.vdeep:hover{border-bottom-color:var(--blue)}

/* ---------- cards / hero ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:2px solid var(--blue);border-radius:14px;padding:20px;margin:0 0 18px}
.hero img{height:74px;width:74px;object-fit:contain;flex:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px}
.hero .t{flex:1 1 240px}
.hero .t b{display:block;font-size:19px;font-weight:800;margin-bottom:4px}

/* ---------- address block ---------- */
.addr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 18px}
.addr .lbl{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.addr .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.addr code{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;color:var(--blue);
  word-break:break-all;flex:1 1 240px;line-height:1.3}

.envs{display:grid;gap:12px}
@media(min-width:660px){.envs{grid-template-columns:1fr 1fr}}
.env{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  display:flex;flex-direction:column;gap:8px}
.env b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.env p{margin:0;font-size:15px;color:var(--mute)}
.env .row{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.env code{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;color:var(--blue);
  word-break:break-all;flex:1 1 180px;line-height:1.3}

/* ---------- notes ---------- */
.note{border-left:6px solid var(--line);background:#fff;padding:13px 17px;border-radius:0 10px 10px 0;margin:16px 0;font-size:15.5px}
.note.ok{border-color:var(--green);background:var(--green-l)}
.note.warn{border-color:#D9820A;background:#FFF8EC}
.note.wico p{display:flex;gap:12px;align-items:flex-start}
.note.wico .ic{color:#D9820A;margin-top:1px}
.note p:last-child{margin:0}

/* ---------- images & placeholders ---------- */
.pw figure{margin:16px 0}
.pw figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.pw figcaption{font-size:14px;color:var(--mute);margin-top:7px}
.pw figcaption i{font-style:italic;opacity:.8}
.pw p > .vdeep{margin-top:2px}
.pw figure img{cursor:zoom-in}
.lb{display:none;position:fixed;inset:0;z-index:200;background:rgba(4,10,20,.88);
  align-items:center;justify-content:center;padding:28px}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:8px;background:#fff;cursor:zoom-out}
.lb .lbx{position:absolute;top:14px;right:18px;font:inherit;font-size:30px;line-height:1;font-weight:700;
  background:transparent;border:0;color:#fff;cursor:pointer;padding:6px 12px}
.ph{border:2px dashed #B9C3D2;background:repeating-linear-gradient(135deg,#fff,#fff 9px,#F4F6F9 9px,#F4F6F9 18px);
  border-radius:8px;padding:22px 18px;margin:16px 0;display:flex;gap:14px;align-items:center;color:var(--mute)}
.ph .t{font-size:15px;font-weight:700}
.ph .f{font-family:ui-monospace,Consolas,monospace;font-size:13px;opacity:.85;word-break:break-all}

/* ---------- guide steps ---------- */
.steps{display:flex;flex-direction:column;gap:10px;margin:0 0 6px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step.open{border-color:var(--blue);box-shadow:0 6px 20px rgba(0,62,151,.10)}
.step .head{display:flex;gap:14px;align-items:center;padding:13px 18px}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.done .num{background:var(--green)}
.step .txt{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.step .txt .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step .txt b{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.step .txt > span{font-size:15px;color:var(--mute)}
.step .ic{flex:none;color:var(--blue)}
.step .go{flex:none;margin-left:auto}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.proc{display:none;border-top:1px solid var(--line);background:#FBFCFE;padding:20px}
.step.open .proc{display:block}
.proc .ptop{display:flex;justify-content:flex-end;margin:-6px 0 10px}

/* ---------- ordered steps inside a procedure ---------- */
.pw ol{margin:0 0 14px;padding-left:0;list-style:none;counter-reset:s}
.pw ol li{counter-increment:s;position:relative;padding-left:42px;margin-bottom:18px;font-size:16px}
.pw ol li::before{content:counter(s);position:absolute;left:0;top:-1px;width:29px;height:29px;
  border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.pw ol li:last-child{margin-bottom:8px}

/* ---------- FAQ ---------- */
.pw details{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--card)}
.pw details[open]{border-color:var(--blue);box-shadow:0 6px 20px rgba(0,62,151,.08)}
.pw summary{cursor:pointer;padding:15px 18px;font-weight:800;font-size:17px;list-style:none;
  display:flex;gap:14px;align-items:center;letter-spacing:-.01em}
.pw summary::-webkit-details-marker{display:none}
.pw summary .ic{color:var(--blue);flex:none}
.pw summary .q{flex:1 1 auto}
.pw summary::after{content:"+";font-weight:400;font-size:25px;color:var(--blue);line-height:1;flex:none}
.pw details[open] summary::after{content:"–"}
.pw .body{padding:2px 18px 18px}

/* ---------- copy field ---------- */
.copybox{background:var(--blue-l);border-radius:10px;padding:12px 14px;margin:10px 0 12px}
.copybox .lbl{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--blue)}
.copybox .copy{margin:0}
.copy{display:flex;gap:10px;align-items:stretch;margin:10px 0 12px;flex-wrap:wrap}
.copy input{flex:1 1 280px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
  padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}

.help{border-top:1px solid var(--line);padding-top:12px;margin-top:16px;font-size:15px;color:var(--mute)}
.foot{border-top:2px solid var(--blue);margin-top:30px;padding-top:14px;font-size:14px;color:var(--mute)}
.duo{display:grid;gap:12px;grid-template-columns:1fr 1fr;align-items:start}
.duo figure{margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print ---------- */
#printarea{display:none}
@media print{
  .pw{background:#fff}
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{display:block;position:absolute;left:0;top:0;width:100%;padding:0;font-size:12pt;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#12161C;line-height:1.5}
  #printarea .phead{display:flex;align-items:center;gap:14px;border-bottom:3px solid #003E97;
    padding-bottom:10px;margin-bottom:18px}
  #printarea .phead img{height:30px;width:auto}
  #printarea .phead .d{margin-left:auto;font-size:10pt;color:#5A6472}
  #printarea h2{font-size:18pt;margin:0 0 14px;color:#003E97}
  #printarea .ptop,#printarea .help{display:none}
  #printarea ol li{page-break-inside:avoid}
  #printarea a{color:#12161C;text-decoration:none}
  #printarea .ph{border:1px dashed #999;background:#fff}
}
</style>

<div class="pw" id="app"></div>
<div id="printarea"></div>

<script>
/* ============================================================
   1. IMAGES — collez ici l'URL publique de chaque capture.
      Laissez la chaîne vide : un emplacement réservé, clairement
      identifié, s'affichera à la place.
      Les chemins "assets/..." fonctionnent en local ; remplacez-les
      par une URL publique (Drive, hébergement) avant la mise en ligne
      sur Google Sites.
   ============================================================ */
var IMG = {

  pwaIcon   : "assets/00-icone-pwa-parallels-euromaster.png", // icône PWA Parallels
  taskbar   : "assets/01-acces-icone-barre-taches-windows.png",
  zoomIcon  : "assets/icone_zoom.png", // bouton de réglage du zoom
  zoomPwa   : "assets/10-zoom-pwa-bouton-reglage.png",   // bouton de zoom dans la fenêtre Parallels
  zoomChrome: "assets/10.2-zoom-pwa-bouton-reglage.png", // zoom depuis le menu de Chrome
  clipAllow : "assets/20-copiercoller-popup-allow.png",
  clipReset : "assets/21-copiercoller-reactiver-clipboard.png",
  pwaBefore : "assets/30-pwa-avant-dans-chrome.png",
  pwaAfter  : "assets/31-pwa-apres-en-pwa.png",
  pwaMenu   : "assets/32-pwa-menu-installer-appli.png",
  pwaEdgeMenu: "assets/35-pwa-menu_installer_edge.png", // même opération dans Microsoft Edge
  pwaConfirm: "assets/33-pwa-confirmer-installation.png",
  pwaPin    : "assets/34-pwa-epingler-barre-taches.png",
  autologin : "assets/40-autologin-add-to-chrome.png",
  autologinLook: "assets/auto_login.png", // aperçu de l'extension AutoLogin
  focusStore: "assets/50-focusimpression-store.png",
  printWin  : "assets/60-impression-fenetre-focus.png", // fenêtre d'impression de Focus
  taskbarBo : "assets/02-icone-barre-taches-backoffice.png", // icône dans la barre des tâches, back office
  iconBo    : "assets/02b-icone-backoffice-zoom.png",        // la même icône, agrandie

  focusStoreBtn: ""  // libre : autre capture du Chrome Web Store si besoin
};

/* 1b. Captures dont les annotations existent en 4 langues.
   Le fichier de base est le français ; les variantes portent le suffixe
   de la langue : 33-....png / 33-....de.png / 33-....nl.png / 33-....en.png
   Si vous passez à des URLs publiques, gardez ce même suffixe avant ".png". */
var LOCALIZED = ["10-zoom-pwa-bouton-reglage.png","10.2-zoom-pwa-bouton-reglage.png","32-pwa-menu-installer-appli.png","33-pwa-confirmer-installation.png","34-pwa-epingler-barre-taches.png","40-autologin-add-to-chrome.png","30-pwa-avant-dans-chrome.png","31-pwa-apres-en-pwa.png","20-copiercoller-popup-allow.png","21-copiercoller-reactiver-clipboard.png","60-impression-fenetre-focus.png","02-icone-barre-taches-backoffice.png"];
function loc(src){
  if(!src || !lang || lang==="fr") return src;
  for(var i=0;i<LOCALIZED.length;i++){
    if(src.indexOf(LOCALIZED[i]) !== -1) return src.replace(/\.png$/, "."+lang+".png");
  }
  return src;
}

/* 2. URLs ---------------------------------------------------- */
var U = {
  fr:{int:"https://myapps.erm.org/fr",ext:"https://myapps.euromaster.com/fr_ext"},
  de:{int:"https://myapps.erm.org/de",ext:"https://myapps.euromaster.com/de_ext"},
  nl:{int:"https://myapps.erm.org/nl",ext:"https://myapps.euromaster.com/nl_ext"},
  en:{int:"https://myapps.erm.org/uk",ext:"https://myapps.euromaster.com/uk_ext"}
};
var STORE_AUTOLOGIN = "https://chromewebstore.google.com/detail/autologin-focus-%E2%80%93-erm-eur/dmkdjcjcehpdipeeghlgegojbfclekbb";
var STORE_FOCUS     = "https://chromewebstore.google.com/detail/focus-impression/bbdfdgdeodcghakchkaboabifekimnld";
var FOCUS_OPTIONS   = "chrome-extension://bbdfdgdeodcghakchkaboabifekimnld/options.html";

/* 3b. VIDÉOS TUTO ------------------------------------------------
   Deux vidéos non répertoriées sur YouTube, une par navigateur.
   ch = seconde de départ de chaque chapitre. */
var VIDEOS = {
  chrome:{ label:"Google Chrome", src:"assets/parallels_chrome.mp4",
    ch:{ open:0, pwa:20, print:57, auto:94, example:110 } },
  edge:{ label:"Microsoft Edge", src:"assets/parallels_edge.mp4",
    ch:{ open:0, pwa:17, print:62, auto:98, example:110 } }

/* 4. PICTOGRAMMES (SVG en trait, aucune dépendance) ----------- */
function ico(n, s){
  s = s || 28;
  var o = '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var p = {
    app     : '<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path><circle cx="6" cy="6.5" r=".6" fill="currentColor"></circle>',
    printer : '<path d="M6 9V3h12v6"></path><rect x="3" y="9" width="18" height="7" rx="2"></rect><rect x="6" y="14" width="12" height="7" rx="1"></rect>',
    key     : '<circle cx="8" cy="12" r="4"></circle><path d="M12 12h9"></path><path d="M18 12v4"></path><path d="M15 12v3"></path>',
    zoom    : '<circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path><path d="M8 10.5h5M10.5 8v5"></path>',
    clip    : '<rect x="8" y="3" width="12" height="15" rx="2"></rect><path d="M16 7H6a2 2 0 0 0-2 2v12"></path>',
    desktop : '<rect x="2" y="4" width="20" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path>',
    globe   : '<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path>',
    cursor  : '<path d="M5 3l6.5 16 2.2-6.3L20 10.5z"></path>',
    warn    : '<path d="M12 3.8 2.9 19.5h18.2z"></path><path d="M12 10v4.2"></path><circle cx="12" cy="17.2" r=".8" fill="currentColor" stroke="none"></circle>',
    play    : '<circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l6 3.5-6 3.5z"></path>'
  }[n] || '';
  return o + p + '</svg>';
}

/* 5. RENDU --------------------------------------------------- */
var app = document.getElementById("app");
var lang = null, profile = null;

function figA(src, cap){ return fig(src, cap); }
function fig(src, cap, file){
  var t = T[lang] || T.fr;
  src = loc(src);
  if(!src) return '<div class="ph">'+ico('desktop',26)+'<div><div class="t">'+t.imgSoon+'</div>'+
    (file?'<div class="f">'+file+'</div>':'')+'</div></div>';
  return '<figure><img src="'+src+'" alt="" onclick="zoomImg(this)" tabindex="0" '+
    'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();zoomImg(this);}">'+
    (cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>';
}
function det(q, body, id, icon){
  return '<details'+(id?' id="'+id+'"':'')+'><summary>'+(icon?ico(icon,26):'')+
    '<span class="q">'+q+'</span></summary><div class="body">'+body+'</div></details>';
}
function help(t){ return '<p class="help">'+t.helpTxt+'</p>'; }
function ol(items){ return '<ol>'+items.map(function(i){return '<li>'+i+'</li>';}).join("")+'</ol>'; }
function printBar(t, key){
  return '<div class="ptop"><button class="btn quiet" onclick="printProc(\''+key+'\',this)">'+
    ico('printer',18)+t.printBtn+'</button></div>';
}

function bar(t){
  var b = '<div class="topbar"><div class="in">'+
    '<div class="logo">'+(IMG.logo?'<img src="'+IMG.logo+'" alt="Euromaster">':'<span>EUROMASTER</span>')+'</div>';
  if(profile) b += '<button class="back" onclick="goProfile(null)">'+t.back+'</button>';
  b += '<div class="spacer"></div>';
  b += '<div class="lang">';
  ["fr","de","nl","en"].forEach(function(k){
    b += '<button onclick="setLang(\''+k+'\')" aria-current="'+(k===lang)+'">'+k.toUpperCase()+'</button>';
  });
  return b+'</div></div></div>';
}

function envRow(t, title, desc, u){
  return '<div class="env"><b>'+title+'</b><p>'+desc+'</p>'+
    '<div class="row"><code>'+u.replace("https://","")+'</code>'+
    '<button class="btn ghost" onclick="cpVal(this,\''+u+'\')">'+ico('clip',18)+t.copy+'</button></div></div>';
}
function addrBlock(t, u){
  return '<div class="addr"><p class="lbl">'+t.addrLbl+'</p><div class="row">'+
    '<code>'+u.replace("https://","")+'</code>'+
    '<button class="btn ghost" onclick="cpVal(this,\''+u+'\')">'+ico('clip',20)+t.copy+'</button>'+
    '</div></div>';
}

/* --- procédures réutilisables --- */
function procPwa(t){
  if(!vBrowser) vBrowser = detectBrowser();
  var edge = vBrowser === "edge";
  var other = edge ? "chrome" : "edge";
  var stepTxt = edge ? t.pwaEdgeStep : t.pwaS2;
  var stepImg = edge ? figA(IMG.pwaEdgeMenu) : figA(IMG.pwaMenu);
  var v = VT[lang] || VT.fr;
  var swap = '<div class="vbrowse" style="margin:0 0 14px"><span>'+v.browser+'</span>';
  ["chrome","edge"].forEach(function(k){
    swap += '<button onclick="setBrowser(\''+k+'\')" aria-current="'+(k===vBrowser)+'">'+
      VIDEOS[k].label+'</button>';
  });
  swap += '</div>';
  return printBar(t,'pwa')+
    swap+
    '<p>'+t.pwaWhy+'</p>'+
    '<div class="duo">'+figA(IMG.pwaBefore,t.pwaBeforeCap)+
      figA(IMG.pwaAfter,t.pwaAfterCap)+'</div>'+
    ol([t.pwaS1,
        stepTxt+stepImg,
        t.pwaS3+figA(IMG.pwaConfirm),
        t.pwaS4+figA(IMG.pwaPin)])+
    '<div class="note ok"><p>'+t.pwaOk+'</p></div>'+help(t);
}
function procFocus(t){

function detectBrowser(){
  /* les postes des centres intégrés sont tous sous Chrome */
  if(profile === "int") return "chrome";
  var ua = navigator.userAgent || "";
  return /Edg\//.test(ua) ? "edge" : "chrome";
}
function vsrc(){ return VIDEOS[vBrowser].src; }
function videoBlock(){
  var v = VT[lang] || VT.fr;
  if(!vBrowser) vBrowser = detectBrowser();
  return '<div class="step vstep" id="video"><div class="head">'+
    '<div class="vnum">'+ico('play',20)+'</div>'+
    '<div class="txt"><div class="ttl"><b>'+v.title+'</b></div><span>'+

function videoPanel(){
  var v = VT[lang] || VT.fr;
  var h = '';
  if(profile !== "int"){
    h += '<div class="vbrowse"><span>'+v.browser+'</span>';
    ["chrome","edge"].forEach(function(k){
      h += '<button onclick="setBrowser(\''+k+'\')" aria-current="'+(k===vBrowser)+'">'+

    });
    h += '</div>';
  }
  h += 
    '<div class="vframe"><video id="vplayer" src="'+vsrc()+'" title="'+v.title+'" '+
    'controls preload="metadata" playsinline></video></div>'+
    '<div class="vchaps"><span class="vlbl">'+v.chapters+'</span>';
  var list = profile === "int" ? ["example"] : CH_ORDER;
  list.forEach(function(k){
    var s = VIDEOS[vBrowser].ch[k];
    var off = (k === "print" && profile !== "ext");
    h += '<button class="'+(off?'vdim':'')+'" onclick="goChapter('+s+')">'+fmt(s)+' · '+v[k]+
      (off?' <i>('+v.notFor+')</i>':'')+'</button>';

  var el = document.getElementById('video');
  if(!el || el.classList.contains('open')) return;
  document.getElementById('vproc').innerHTML = videoPanel();
  el.classList.add('open');
  if(profile === "int"){
    var f = document.getElementById('vplayer');
    if(f) f.addEventListener('loadedmetadata', function(){
      try{ f.currentTime = VIDEOS[vBrowser].ch.example; }catch(e){}
    }, {once:true});
  }

  var el = document.getElementById('video');

function fmt(s){ var m = Math.floor(s/60), r = s%60; return m+":"+(r<10?"0":"")+r; }
function setBrowser(k){
  vBrowser = k; vManual = true;
  var p = document.getElementById('vproc');
  if(p && p.innerHTML) p.innerHTML = videoPanel();

  if(pw && pw.innerHTML) pw.innerHTML = procPwa(T[lang]);

  for(var i=0;i<links.length;i++){

    var lbl = links[i].querySelector('.vd');
    if(lbl) lbl.textContent = v.deep+' · '+fmt(sec);
  }

function goChapter(sec){
  openVideo();
  var f = document.getElementById('vplayer');
  if(f){
    var seek = function(){
      /* Le déplacement exige un hébergement qui répond aux requêtes partielles
         (GitHub Pages le fait). Sinon on l'indique au lieu de relire depuis 0. */
      var ok = f.seekable && f.seekable.length && f.seekable.end(0) > 0;
      if(!ok){ warnNoSeek(sec); return; }
      try{ f.currentTime = sec; f.play(); }catch(e){ warnNoSeek(sec); }
    };
    if(f.readyState >= 1) seek();
    else f.addEventListener('loadedmetadata', seek, {once:true});
  }
  var b = document.getElementById('video');
  if(b) window.scrollTo({top:b.getBoundingClientRect().top+window.pageYOffset-60,behavior:'smooth'});
}
function warnNoSeek(sec){
  var v = VT[lang] || VT.fr;
  var host = document.getElementById('vproc');
  if(!host) return;
  var n = host.querySelector('.vseek');
  if(!n){
    n = document.createElement('p');
    n.className = 'note warn vseek';
    host.appendChild(n);
  }
  n.innerHTML = v.noSeek+' <b>'+fmt(sec)+'</b>.';
}

/* --- copier --- */
function cpVal(btn, v, inputId){
  /* Dans un embed, l'API presse-papiers peut être bloquée : on tente
     plusieurs voies, puis on sélectionne le texte pour un Ctrl + C manuel. */
  var done = false;
  var ta = document.createElement('textarea');
  ta.value = v;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, v.length);
  try{ done = document.execCommand('copy'); }catch(e){ done = false; }
  document.body.removeChild(ta);
  if(!done && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(function(){ flash(btn, T[lang].copied); },
      function(){ manualCopy(btn, inputId); });
    return;
  }
  if(done) flash(btn, T[lang].copied);
  else manualCopy(btn, inputId);
}
function manualCopy(btn, inputId){
  /* on sélectionne le texte réellement visible pour que Ctrl + C ait un effet :
     le champ quand il y en a un, sinon l'adresse affichée à côté du bouton */
  var i = inputId ? document.getElementById(inputId) : null;
  if(i){ i.focus(); i.select(); i.setSelectionRange(0, i.value.length); flash(btn, T[lang].copyManual); return; }
  var code = btn && btn.parentNode ? btn.parentNode.querySelector('code') : null;
  if(code && window.getSelection && document.createRange){
    var r = document.createRange();
    r.selectNodeContents(code);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    flash(btn, T[lang].copyManual);
    return;
  }
  flash(btn, T[lang].copyFail);
}

function flash(btn, msg){
  if(!btn) return;
  if(btn.dataset.orig === undefined) btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = msg || T[lang].copied;
  clearTimeout(btn._t);
  btn._t = setTimeout(function(){ btn.innerHTML = btn.dataset.orig; }, 2400);
}

  try{ w = window.open('', '_blank'); }catch(e){}
  if(!w){
    /* pop-up bloquée (embed Google Sites) : on propose un lien visible et cliquable */
    var url = URL.createObjectURL(new Blob([doc], {type:'text/html'}));
    var host = btn && btn.parentNode ? btn.parentNode : null;
    if(host){
      var prev = host.parentNode.querySelector('.printfallback');
      if(prev) prev.parentNode.removeChild(prev);
      var n = document.createElement('div');
      n.className = 'note warn printfallback';
      n.innerHTML = '<p>'+t.printBlocked+'</p>'+
        '<p style="margin:10px 0 0"><a class="btn" href="'+url+'" target="_blank" rel="noopener">'+
        t.printOpen+'</a></p>';
      host.parentNode.insertBefore(n, host.nextSibling);
    } else {
      window.open(url, '_blank');
    }
    return;
  }
  w.document.open(); w.document.write(doc); w.document.close();
  w.focus();
  var go = function(){ try{ w.print(); }catch(e){} };
  if(w.document.readyState === 'complete') setTimeout(go, 350); else w.onload = function(){ setTimeout(go, 350); };
}

render();
</script>
